video:
  width: 1080
  height: 1920
  fps: 30
  min_seconds: 3
  max_seconds: 90
  crf: 20
  gop: 60
  # Zoom/pan cho footage ảnh (still). `pan`: center | left_right | right_left |
  # top_bottom | bottom_top. Zoom chạy hết đúng độ dài clip, không đứng hình.
  ken_burns:
    enabled: true
    zoom_start: 1.0
    zoom_end: 1.12
    pan: left_right

safe_zone:
  top: 200
  bottom: 360
  side: 72
  right_ui: 110

hook:
  seconds: 3.0
  title_size: 78
  # Cỡ chữ tiêu đề khi hiện full list (hook dùng title_size). Tự co lại nếu chữ dài.
  full_title_size: 62

style:
  title_color: "#FF2A2A"
  item_label_color: "#FFE566"
  item_text_color: "#FFF4B0"
  footer_color: "#4CA3FF"
  panel_rgba: [0, 0, 0, 150]
  stroke_rgba: [0, 0, 0, 220]
  stroke_width: 3
  panel_radius: 28

audio:
  voice_rate: "-8%"
  voice_name: "vi-VN-NamMinhNeural"
  # Heuristic để cảnh báo script quá dài TRƯỚC khi gọi TTS (sai số ~±15%).
  # Hiệu chuẩn trên vi-VN-NamMinhNeural: 353 ký tự ≈ 41.5s ở rate -8%.
  voice_chars_per_second: 9.2
  music_volume: 0.12
  tail_seconds: 1.2
  head_seconds: 0.6
  sample_rate: 48000
  channels: 2
  ducking:
    threshold: 0.06
    ratio: 7
    attack: 40
    release: 400

facebook:
  api_version: "v26.0"
  daily_limit: 30
  max_retries: 3
  # Trần thời gian chờ giữa 2 lần thử lại; Graph trả estimated_time_to_regain_access
  # cho lỗi hạn mức (code 4/17/32/613) và giá trị đó bị kẹp bởi trần này.
  retry_max_delay_seconds: 900

queue:
  # `publish.py --queue` giữ lock này để 2 cron không lấy cùng 1 clip.
  # Lock cũ hơn số giây dưới đây (process chết, máy reboot) bị coi là rác và lấy lại.
  stale_lock_seconds: 3600

content:
  # Chặn đăng bài quá giống bài đã publish (Jaccard trên nội dung đã chuẩn hoá).
  # 0.85 = trùng từ 85% nội dung trở lên; đặt 0 để tắt.
  duplicate_similarity: 0.85
  # Chủ đề xoay vòng — `python3 src/topics.py next` chọn cái ít dùng nhất, lâu nhất.
  topics:
    - Phân loại tài sản theo thu nhập mỗi tháng
    - Cách sống đẳng cấp sau tuổi 30
    - Cách gia tăng tài sản theo số vốn
    - Kiểu người dễ thành công
    - Cổ nhân nói về đạo vợ chồng
    - Thói quen người giàu làm mỗi sáng
    - Sai lầm tài chính trước tuổi 35
    - Dấu hiệu bạn đang dừng ở tầng trung lưu

insights:
  # Metric của Graph `video_insights`; tuỳ loại video/quyền token mà Graph từ chối một số metric
  # (script tự thử lại từng metric và ghi lại cái lỗi vào data/insights.json).
  metrics:
    - blue_reels_play_count
    - post_video_views
    - post_video_avg_time_watched
    - post_reactions_by_type_total

cover:
  # Ảnh cover lấy từ 1 frame trong đoạn hook (tiêu đề hiện rõ); dùng cho thumbnail YouTube
  # và cho các nền tảng cần ảnh cover. at_seconds: 0 = giữa đoạn hook.
  enabled: true
  at_seconds: 0
  # Mốc cover gửi cho TikTok (ms); 0 = để TikTok tự chọn
  tiktok_cover_ms: 0

crosspost:
  # Đăng thêm sau khi Reel lên Facebook: [] = tắt, hoặc [youtube], [youtube, tiktok].
  # Có thể ghi đè bằng `publish.py --crosspost youtube,tiktok` (hoặc --crosspost none).
  targets: []
  youtube_category_id: "22"
  youtube_privacy: public
  tiktok_privacy: SELF_ONLY

schedule:
  # Dùng cho `src/scheduler.py` (container/Docker). Giờ UTC; cron của host thì dùng
  # scripts/cron.example. Biến môi trường SCHEDULE_HOUR/MINUTE/COMMAND ghi đè config này.
  hour: 7
  minute: 0
  command: "python3 src/publish.py --queue"

cleanup:
  # `src/cleanup.py` chỉ xoá file cũ hơn số ngày này và không nằm trong queue.
  keep_days: 30

paths:
  fonts_dir: assets/fonts
  footage_dir: assets/footage
  music_dir: assets/music
  voice_dir: assets/voice
  overlay_dir: assets/overlays
  out_dir: assets/out
  queue_dir: data/queue
  published_log: data/published.json
  insights_log: data/insights.json
  title_font: BeVietnamPro-Black.ttf
  body_font: BeVietnamPro-ExtraBold.ttf
  footer_font: BeVietnamPro-SemiBold.ttf
