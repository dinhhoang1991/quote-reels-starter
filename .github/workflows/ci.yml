name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      # Không cài FFmpeg: test phải chạy được trên máy chưa có FFmpeg.
      - run: python -m unittest discover -s tests -t . -v

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Preflight phải sạch fail
        run: python src/doctor.py --json data/samples/clip_001.json

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Smoke render (kiểm audio dài đúng bằng video)
        run: python scripts/smoke_render.py --seconds 2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quote-reels-starter:ci .
      - name: Doctor trong container (phải 0 fail)
        run: docker run --rm --entrypoint python3 quote-reels-starter:ci src/doctor.py --json data/samples/clip_001.json
      - name: Test suite trong container
        run: docker run --rm --entrypoint python3 quote-reels-starter:ci -m unittest discover -s tests -t .
      - name: Smoke render trong container
        run: docker run --rm --entrypoint python3 quote-reels-starter:ci scripts/smoke_render.py --seconds 2
